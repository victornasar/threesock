# threesock's own configuration: the repo is scanned by itself in CI.
version: 1

scope:
  - security

ignore:
  # Deliberately insecure fixture repos used by the test suite. Their planted
  # findings are asserted by test/golden/insecure-app.json instead.
  - 'test/fixtures/**'

exceptions:
  # Decision 7 and 27: commits land directly on main until the GitHub repository
  # and branch protection exist; from then on every change goes through a PR.
  - rule: cc8.1/direct-pushes
    approver: '@victornasar'
    justification: 'Pre-launch history committed directly to main before the GitHub repo and branch protection exist.'
    expires: 2027-01-20
  # Decision 47: the ruleset requires pull requests but 0 approvals while there is one
  # maintainer (risk R6). Matched by fingerprint so other branch-protection gaps still show.
  - fingerprint: 7cfcf5c6ce94aabe
    approver: '@victornasar'
    justification: 'Solo maintainer: an approval from someone other than the author is not yet possible. Lapses when a second maintainer joins.'
    expires: 2027-01-20
