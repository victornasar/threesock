name: release

# Stages releases on npm from a v* tag only (decisions 3 and 54), via npm trusted
# publishing (OIDC, no token) with provenance. The maintainer then approves each
# staged package with 2FA; only that makes it public.
# Configure on npmjs.com, for both threesock and threesock-mcp: Trusted publisher →
# GitHub Actions, repository victornasar/threesock, workflow release.yml, environment npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # protected environment: add required reviewers in repository settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Tag must match both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in package.json packages/mcp/package.json; do
            version="v$(node -p "require('./$pkg').version")"
            [ "$TAG" = "$version" ] || { echo "::error::tag $TAG does not match $pkg $version"; exit 1; }
          done
      - run: pnpm run check
      # pnpm pack rewrites threesock-mcp's workspace dependency to the exact version;
      # npm publish then uses trusted publishing (OIDC) and adds provenance.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkgs"
          pnpm --filter threesock-mcp pack --pack-destination "$RUNNER_TEMP/pkgs"
      # Decision 54: every release is staged, never published directly. The trusted
      # publishers on npm allow staging only (createStagedPackage), so nothing reaches
      # npm until the maintainer approves each package with their own 2FA:
      #   npm stage list <package>   then   npm stage approve <id>
      - name: Stage packages for 2FA approval (OIDC, provenance)
        run: |
          {
            echo '## Staged for approval'
            echo
            echo 'Approve each package with your 2FA (run with npm, logged in):'
            echo
            echo '```sh'
          } >> "$GITHUB_STEP_SUMMARY"
          for tgz in "$RUNNER_TEMP"/pkgs/threesock-[0-9]*.tgz "$RUNNER_TEMP"/pkgs/threesock-mcp-*.tgz; do
            out=$(npm stage publish "$tgz" --access public --provenance 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            id=$(printf '%s\n' "$out" | sed -nE 's/.*staged with id ([0-9a-f-]+).*/\1/p' | head -1)
            echo "npm stage approve $id   # $(basename "$tgz" .tgz)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
