name: release

# Publishes to npm from a v* tag only (decision 3), via npm trusted publishing:
# OIDC instead of an npm token, with provenance generated automatically.
# Configure on npmjs.com, for both threesock and threesock-mcp: Trusted publisher →
# GitHub Actions, repository victornasar/threesock, workflow release.yml, environment npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # protected environment: add required reviewers in repository settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Tag must match both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in package.json packages/mcp/package.json; do
            version="v$(node -p "require('./$pkg').version")"
            [ "$TAG" = "$version" ] || { echo "::error::tag $TAG does not match $pkg $version"; exit 1; }
          done
      - run: pnpm run check
      # pnpm pack rewrites threesock-mcp's workspace dependency to the exact version;
      # npm publish then uses trusted publishing (OIDC) and adds provenance.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkgs"
          pnpm --filter threesock-mcp pack --pack-destination "$RUNNER_TEMP/pkgs"
      # Decision 53: the first release uses a stage-only NPM_TOKEN on the npm environment.
      # `npm stage publish` uploads without publishing; the maintainer then approves each
      # package with their own 2FA (npmjs.com or `npm stage approve`). Once both packages
      # have trusted publishers and the secret is deleted, this publishes through OIDC.
      - name: Publish (stage with token, or trusted publishing)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then cmd=(npm stage publish); else cmd=(npm publish); fi
          for tgz in "$RUNNER_TEMP"/pkgs/threesock-[0-9]*.tgz "$RUNNER_TEMP"/pkgs/threesock-mcp-*.tgz; do
            "${cmd[@]}" "$tgz" --access public --provenance
          done
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::Staged for approval. Approve both packages on npmjs.com (or npm stage approve) with your 2FA."
          fi
