name: release

# Publishes to npm from a v* tag only (decision 3), via npm trusted publishing:
# OIDC instead of an npm token, with provenance generated automatically.
# Configure on npmjs.com: package threesock → Trusted publisher → GitHub Actions,
# repository threesock/threesock, workflow release.yml, environment npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # protected environment: add required reviewers in repository settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$version" ] || { echo "::error::tag $TAG does not match package.json $version"; exit 1; }
      - run: pnpm run check
      - name: Publish (OIDC, provenance)
        run: npm publish --access public
