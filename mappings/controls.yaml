# threesock control and policy mapping.
#
# A self-contained file: the catalogue of internal controls and policies, and the
# SOC 2 criteria each one supports. Replace it with your own catalogue by pointing
# `mappings:` in threesock.yaml at a file with the same shape.
#
# The default catalogue is the control and policy list in docs/rubric/COMPLIANCE_QUESTIONS.txt.
# The mapping is a starting point drafted for threesock; review it against your own program.

version: 1
name: threesock default catalogue

controls:
  - 'Acceptable Use'
  - 'Access Rights'
  - 'Asset Inventory'
  - 'Change management'
  - 'Configuration & Patch Management'
  - 'Credential Management'
  - 'Data Privacy'
  - 'Data Retention & Destruction'
  - 'Disaster Recovery Planning'
  - 'Disciplinary process'
  - 'Encrypted Data at Rest'
  - 'Encryption Key Management'
  - 'Endpoint Protection'
  - 'Endpoint Security'
  - 'Information Classification'
  - 'Management Security Accountability'
  - 'Network Security'
